plugins { id 'com.android.application' }
android {
    namespace 'org.healthchallenge.hidvia'
    compileSdk 35
    defaultConfig {
        applicationId 'org.healthchallenge.hidvia'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-demo'
    }
    buildTypes {
        debug { applicationIdSuffix '.demo' }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
